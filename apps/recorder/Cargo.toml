[package]
name = "neo-recorder"
description = "Neo Recorder: record the screen, a window or an area"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neo.workspace = true
neo-desktop.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
global-hotkey = "0.8"

# The menu bar and system tray icon. Linux uses the StatusNotifierItem
# protocol over D-Bus instead, which needs no GTK.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = { version = "0.26", default-features = false }
png = "0.18"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.23"
gif = "0.13"

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
