[package]
name = "neo-photos"
description = "Photos: view pictures, with zoom, rotate and a walk through the folder"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neo.workspace = true
neo-desktop.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }

[build-dependencies]
cc = "1"
