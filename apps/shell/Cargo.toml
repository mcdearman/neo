[package]
name = "neo-shell"
description = "NeoShell: the desktop's background services, starting with notifications"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neo.workspace = true
neo-desktop.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# The keys that move between tiled windows and change their layout.
global-hotkey = "0.8"

[build-dependencies]
cc = "1"
