[package]
name = "neo-desktop"
description = "Shared pieces of the Neo desktop apps: appearance settings, file helpers and common UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neo.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml_edit = "0.22"

# For reading the icons of files and apps.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
