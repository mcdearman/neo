[package]
name = "neo-apollo-core"
description = "The library behind Apollo, Neo's assistant: its encrypted memory and its model"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neo-desktop.workspace = true
# SQLite encrypted with SQLCipher, and sqlite-vec for searching by meaning.
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
sqlite-vec = "0.1"
ureq = { version = "3", default-features = false, features = ["json"] }
serde_json = "1.0.151"
base64 = "0.22"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
block2 = "0.6"
