[package]
name = "neo-apollo-core"
description = "The library behind Apollo, Neo's assistant: its encrypted memory and its model"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neo-desktop.workspace = true
neo-index.workspace = true
neo-sight = { path = "../neo-sight" }
# SQLite encrypted with SQLCipher, and sqlite-vec for searching by meaning.
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
sqlite-vec = "0.1"
ureq = { version = "3", default-features = false, features = ["json"] }
serde_json = "1.0.151"
base64 = "0.22"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# What a camera wrote in a picture: when it was taken, and with what.
kamadak-exif = "0.6"

# Windows has no OpenSSL of its own for SQLCipher to use, so one is built
# with it. That build needs a Windows Perl (Strawberry Perl) and NASM.
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
# Windows Hello, to check who is asking, and the lock on the key that the
# user's login is.
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
windows-future = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
block2 = "0.6"
