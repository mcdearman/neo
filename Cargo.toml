[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcdearman/neo"

[workspace.dependencies]
neo-theme = { path = "crates/neo-theme" }
# The framework underneath, at a revision that is known to work with this
# one. To work on both side by side, see `.cargo/local.toml.example`.
armature-render = { git = "https://github.com/mcdearman/armature", rev = "359d6352b9d097f3b4273db3cdfa602bca48550f" }
armature = { git = "https://github.com/mcdearman/armature", rev = "359d6352b9d097f3b4273db3cdfa602bca48550f" }
neo = { path = "crates/neo" }
neo-desktop = { path = "crates/neo-desktop" }
neo-term = { path = "crates/neo-term" }
