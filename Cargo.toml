[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcdearman/neo"

[workspace.dependencies]
neo-theme = { path = "crates/neo-theme" }
# The framework lives in its own repository, checked out next to this one.
armature-render = { path = "../armature/crates/armature-render" }
armature = { path = "../armature/crates/armature" }
neo = { path = "crates/neo" }
neo-desktop = { path = "crates/neo-desktop" }
neo-term = { path = "crates/neo-term" }
